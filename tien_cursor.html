<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MangaViet - Doc Truyen Tranh Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { background:#181524; color:#eae6f5; cursor:none; min-width: 1280px; }
  header.site { height:66px; background:#211d33; display:flex; align-items:center; justify-content:space-between; padding:0 28px; border-bottom: 3px solid #a86bff; }
  header.site .logo { font-size:21px; font-weight:800; color:#a86bff; }
  header.site nav a { color:#cfc7e6; margin-left:20px; text-decoration:none; font-size:13.5px; }
  
  .intro-wrap { max-width: 900px; margin: 40px auto; background: #211d33; padding: 40px; border-radius: 20px; text-align: center; }
  
  /* KHÓA CỨNG KHUNG LAB 1280x800 */
  #lab-wrapper { position: relative; width: 1280px; height: 800px; margin: 0 auto; overflow: hidden; }
  #victimFrame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 30; opacity: 0; }
  
  /* TỌA ĐỘ CHUẨN XÁC (Khớp với nút Chia sẻ địa chỉ của Tiên) */
  #trapZone { position:absolute; top: 526px; left: 322px; width: 431px; height: 42px; z-index: 20; background: transparent; border:none; }
  /* Nút mồi (Đọc chương tiếp theo) đặt lệch 320px sang phải để khớp với con trỏ giả */
  #nextChapterBtn { position:absolute; top: 526px; left: 642px; width: 431px; height: 42px; background: linear-gradient(90deg,#9b5cff,#6a2bd7); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer; z-index: 20; pointer-events:none; }

  #fakeCursor { position: fixed; width: 30px; height: 30px; z-index: 60; pointer-events: none; top: 0; left: 0; will-change: transform; }
  #demoToggle { position: fixed; bottom: 16px; left: 16px; z-index: 99; background:#1b2430; color:#fff; border:1px solid #39495f; border-radius: 10px; padding: 10px 14px; font-size: 12px; cursor:pointer; font-weight:700; }
  #demoLabel { position: fixed; bottom: 54px; left:16px; z-index:99; background:#000a; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; }
</style>
</head>
<body>
<header class="site">
  <div class="logo">📖 MangaViet</div>
  <nav><a href="#">Trang chủ</a><a href="#">Thể loại</a><a href="#">BXH</a></nav>
</header>

<div class="intro-wrap">
  <h1>Trận chiến cuối cùng ở Đảo Cuối Cùng</h1>
  <p style="color:#9c93bd; margin-top:10px;">Trang 18 / 19</p>
</div>

<div id="lab-wrapper">
  <button id="trapZone" onclick="alert('Bạn đã click vào VÙNG BẪY (Nút Chia sẻ địa chỉ của ShopMart)!')"></button>
  <button id="nextChapterBtn">Đọc chương tiếp theo ➜</button>
  <iframe id="victimFrame" src="http://127.0.0.1:5000/?scenario=tien"></iframe>
</div>

<svg id="fakeCursor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path d="M3 2 L21 12 L13 13 L10 21 Z" fill="#ffffff" stroke="#a86bff" stroke-width="1.4"/>
</svg>

<div id="demoLabel">Độ lệch con trỏ: <span id="opVal">320px</span></div>
<button id="demoToggle" onclick="toggleOffset()">🎚 Chuyển chế độ (Giảng viên / Tấn công)</button>

<script>
  var fake = document.getElementById('fakeCursor');
  var frame = document.getElementById('victimFrame');
  var offset = 320; 
  var demoMode = false; 

  // SỬA LỖI GIẬT: Dùng transform thay vì left/top
  document.addEventListener('mousemove', function(e){
    var fx = e.clientX + offset;
    var fy = e.clientY;
    fake.style.transform = 'translate3d(' + fx + 'px, ' + fy + 'px, 0)';
  });

  function toggleOffset() {
    demoMode = !demoMode;
    if (demoMode) {
      offset = 0; 
      frame.style.opacity = '0.35';
      document.getElementById('opVal').innerText = '0px (chế độ giải thích)';
      document.body.style.cursor = 'auto';
    } else {
      offset = 320;
      frame.style.opacity = '0';
      document.getElementById('opVal').innerText = '320px (tấn công thật)';
      document.body.style.cursor = 'none';
    }
  }
</script>
</body>
</html>
