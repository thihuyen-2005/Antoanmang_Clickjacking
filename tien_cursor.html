<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaViet - Doc Truyen Tranh Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { background:#181524; color:#eae6f5; cursor:none; } /* an con tro that */

  header.site {
    height:66px; background:#211d33; display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; border-bottom: 3px solid #a86bff;
  }
  header.site .logo { font-size:21px; font-weight:800; color:#a86bff; }
  header.site nav a { color:#cfc7e6; margin-left:20px; text-decoration:none; font-size:13.5px; }

  .reader {
    max-width: 900px; margin: 30px auto; background:#211d33; border-radius:16px;
    padding: 26px 40px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .reader .chapter-title { font-size:12px; color:#a86bff; font-weight:700; }
  .reader h1 { font-size:22px; margin: 6px 0 20px; }
  .panel {
    background: linear-gradient(135deg,#2c2645,#191531); border-radius:12px; height: 380px;
    display:flex; align-items:center; justify-content:center; font-size:60px; margin-bottom:20px;
    border: 1px solid #3a3160;
  }
  .nav-row { display:flex; justify-content:space-between; align-items:center; }
  .page-info { font-size:13px; color:#9c93bd; }

  #nextChapterBtn {
    background: linear-gradient(90deg,#a86bff,#7a3ee0); color:#fff; border:none;
    padding: 12px 22px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer;
  }

  /* ----- IFRAME NAN NHAN ----- */
  #victimFrame {
    position: fixed; top:0; left:0; width:100vw; height:100vh; border:none;
    z-index: 30; opacity: 0; pointer-events: none;
  }

  /* ----- CON TRO GIA (SVG) - lech 320px sang phai so voi con tro that ----- */
  #fakeCursor {
    position: fixed; width: 30px; height: 30px; z-index: 60; pointer-events: none;
    transform: translate(-6px,-3px);
  }

  /* ----- NUT BAY (vo hinh, dat dung vi tri con tro THAT se dang o do,
     tuc la lech 320px SANG TRAI so voi vi tri hien thi cua con tro gia,
     va trung khop voi nut "Chia se dia chi" cua ShopMart) ----- */
  #trapZone {
    position: fixed; top:450px; left:340px; width:260px; height:50px;
    z-index: 50; background: transparent; border:none; cursor:none;
  }

  #demoToggle {
    position: fixed; bottom: 16px; left: 16px; z-index: 99; cursor: pointer !important;
    background:#1b2430; color:#fff; border:1px solid #39495f; border-radius: 10px;
    padding: 10px 14px; font-size: 12px; font-weight:700;
  }
  #demoLabel { position: fixed; bottom: 54px; left:16px; z-index:99; background:#000a; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; }
</style>
</head>
<body>

<header class="site">
  <div class="logo">📖 MangaViet</div>
  <nav><a href="#">Trang chu</a><a href="#">The loai</a><a href="#">BXH</a></nav>
</header>

<div class="reader">
  <div class="chapter-title">DAO HAI TAC · CHUONG 1089</div>
  <h1>Tran Chien Cuoi Cung O Dao Cuoi Cung</h1>
  <div class="panel">🏴‍☠️🌊⚔️</div>
  <div class="nav-row">
    <span class="page-info">Trang 18 / 19</span>
    <button id="nextChapterBtn">Doc Chuong Tiep Theo ➜</button>
  </div>
</div>

<!-- IFRAME NAN NHAN -->
<iframe id="victimFrame" src="http://localhost:5000"></iframe>

<!-- VUNG BAY: vo hinh, nam dung vi tri con tro THAT (lech trai 320px so voi con tro gia) -->
<button id="trapZone" onclick="trapClick()"></button>

<!-- CON TRO GIA (SVG mui ten) -->
<svg id="fakeCursor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path d="M3 2 L21 12 L13 13 L10 21 Z" fill="#ffffff" stroke="#a86bff" stroke-width="1.4"/>
</svg>

<div id="demoLabel">Do lech con tro: <span id="opVal">320px</span></div>
<button id="demoToggle" onclick="toggleOffset()">🎚 Chuyen che do (Giang vien / Tan cong that)</button>

<script>
  var fake = document.getElementById('fakeCursor');
  var offset = 320; // px lech sang phai cua con tro GIA so voi con tro THAT
  var demoMode = false; // false = tan cong that (lech hoan toan), true = giai thich (hien vong tron do o vi tri that)

  document.addEventListener('mousemove', function(e){
    var fx = e.clientX + offset;
    var fy = e.clientY;
    fake.style.left = fx + 'px';
    fake.style.top = fy + 'px';
  });

  function toggleOffset() {
    demoMode = !demoMode;
    var frame = document.getElementById('victimFrame');
    if (demoMode) {
      offset = 0; // tat lech -> con tro that = con tro gia, de giang vien thay ro vi tri that
      frame.style.opacity = '0.35';
      document.getElementById('opVal').innerText = '0px (che do giai thich)';
      document.body.style.cursor = 'auto';
    } else {
      offset = 320;
      frame.style.opacity = '0';
      document.getElementById('opVal').innerText = '320px (tan cong that)';
      document.body.style.cursor = 'none';
    }
  }

  function trapClick() {
    alert('🎯 [DEMO] Ban vua nhin thay con tro gia tro vao nut "Doc Chuong Tiep Theo", nhung con tro THAT (vo hinh, cursor:none) lai dang nam tren nut "Chia se dia chi nha & SDT" cua ShopMart. Click vua roi da gui yeu cau that!');
  }
</script>
</body>
</html>
