<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaViet - Doc Truyen Tranh Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { background:#181524; color:#eae6f5; cursor:none; overflow-x:hidden; } /* an con tro that */

  header.site {
    height:66px; background:#211d33; display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; border-bottom: 3px solid #a86bff;
  }
  header.site .logo { font-size:21px; font-weight:800; color:#a86bff; }
  header.site nav a { color:#cfc7e6; margin-left:20px; text-decoration:none; font-size:13.5px; }

  .reader {
    position:relative;
    max-width: 900px; margin: 30px auto; background:linear-gradient(145deg,#25203a,#201c32);
    border:1px solid #322b4a; border-radius:18px;
    padding: 26px 30px 35px 40px; box-shadow: 0 16px 38px rgba(0,0,0,.32);
  }
  .reader .chapter-title {
    display:inline-flex; align-items:center; gap:8px; font-size:11px;
    color:#c49cff; font-weight:800; letter-spacing:.5px;
  }
  .reader .chapter-title::before {
    content:""; width:7px; height:7px; border-radius:50%; background:#a86bff;
    box-shadow:0 0 10px rgba(168,107,255,.7);
  }
  .reader h1 { font-size:23px; margin: 8px 0 20px; letter-spacing:.1px; }
  .panel {
    background:radial-gradient(circle at 50% 48%,#332a50 0,#211b38 52%,#191531 100%);
    border-radius:14px; height:353px; display:flex; align-items:center; justify-content:center;
    font-size:60px; margin-bottom:20px; border:1px solid #40365f;
    box-shadow:inset 0 1px rgba(255,255,255,.04);
  }
  .nav-row { display:flex; justify-content:space-between; align-items:center; }
  .page-info { font-size:13px; color:#9c93bd; }

  #nextChapterBtn {
    background: linear-gradient(90deg,#9b5cff,#6a2bd7); color:#fff; border:none;
    position:static;
    width:calc((100vw - 462px) / 2); height:42px;
    z-index:20; padding: 12px 22px; border-radius:10px;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }

  /* ----- IFRAME NAN NHAN ----- */
  #victimFrame {
    position:absolute; top:0; left:0; width:100vw; height:100vh; border:none;
    z-index: 30; opacity: 0;
  }

  /* ----- CON TRO GIA (SVG) - lech 320px sang phai so voi con tro that ----- */
  #fakeCursor {
    position: fixed; width: 30px; height: 30px; z-index: 60; pointer-events: none;
    transform: translate(-6px,-3px);
  }

  /* ----- NUT BAY (vo hinh, dat dung vi tri con tro THAT se dang o do,
     tuc la lech 320px SANG TRAI so voi vi tri hien thi cua con tro gia,
     va trung khop voi nut "Chia se dia chi" cua ShopMart) ----- */
  #trapZone {
    position:absolute; top:479px; left:calc(50% - 309.5px);
    width:calc((100vw - 462px) / 2); height:42px;
    z-index: 20; pointer-events:none; background: transparent; border:none; cursor:none;
  }

  #demoToggle {
    position: fixed; bottom: 16px; left: 16px; z-index: 99; cursor: pointer !important;
    background:#1b2430; color:#fff; border:1px solid #39495f; border-radius: 10px;
    padding: 10px 14px; font-size: 12px; font-weight:700;
  }
  #demoLabel { position: fixed; bottom: 54px; left:16px; z-index:99; background:#000a; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; }
  #actionResult {
    display:none; position:fixed; right:16px; bottom:16px; z-index:100; max-width:360px;
    padding:13px 16px; border-radius:11px; font-size:13px; font-weight:700;
    box-shadow:0 8px 22px rgba(0,0,0,.24);
  }
  #actionResult.success { display:block; background:#f1eaff; color:#53298a; border:1px solid #d5c1f5; }
  #actionResult.error { display:block; background:#fff0ee; color:#a52a21; border:1px solid #edb9b3; }
</style>
</head>
<body>

<header class="site">
  <div class="logo">📖 MangaViet</div>
  <nav><a href="#">Trang chủ</a><a href="#">Thể loại</a><a href="#">BXH</a></nav>
</header>

<div class="reader">
  <div class="chapter-title">ĐẢO HẢI TẶC <span>·</span> CHƯƠNG 1089</div>
  <h1>Trận chiến cuối cùng ở Đảo Cuối Cùng</h1>
  <div class="panel">🏴‍☠️🌊⚔️</div>
  <div class="nav-row">
    <span class="page-info">Trang 18 / 19</span>
    <button id="nextChapterBtn">Đọc chương tiếp theo ➜</button>
  </div>
  <div id="trapZone"></div>
</div>

<!-- IFRAME NAN NHAN -->
<iframe id="victimFrame" src="http://127.0.0.1:5000/?scenario=tien"></iframe>

<!-- CON TRO GIA (SVG mui ten) -->
<svg id="fakeCursor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path d="M3 2 L21 12 L13 13 L10 21 Z" fill="#ffffff" stroke="#a86bff" stroke-width="1.4"/>
</svg>

<div id="demoLabel">Độ lệch con trỏ: <span id="opVal">320px</span></div>
<button id="demoToggle" onclick="toggleOffset()">🎚 Chuyển chế độ (Giảng viên / Tấn công)</button>
<div id="actionResult" role="status" aria-live="polite"></div>

<script>
  var fake = document.getElementById('fakeCursor');
  var offset = 320; // px lech sang phai cua con tro GIA so voi con tro THAT
  var demoMode = false; // false = tan cong that (lech hoan toan), true = giai thich (hien vong tron do o vi tri that)
  var frame = document.getElementById('victimFrame');
  var actionResult = document.getElementById('actionResult');

  window.addEventListener('message', function(event) {
    if (event.origin !== 'http://127.0.0.1:5000' || event.source !== frame.contentWindow) return;
    if (!event.data || event.data.type !== 'shopmart-action-result' || event.data.action !== 'tien') return;

    actionResult.className = event.data.ok === true ? 'success' : 'error';
    actionResult.innerText = event.data.ok === true
      ? '✓ Flask đã ghi nhận thao tác mô phỏng: Tiên.'
      : '✕ Gửi thất bại. Hãy kiểm tra Flask tại 127.0.0.1:5000.';
  });

  document.addEventListener('mousemove', function(e){
    var fx = e.clientX + offset;
    var fy = e.clientY;
    fake.style.left = fx + 'px';
    fake.style.top = fy + 'px';
  });

  function toggleOffset() {
    demoMode = !demoMode;
    if (demoMode) {
      offset = 0; // tat lech -> con tro that = con tro gia, de giang vien thay ro vi tri that
      frame.style.opacity = '0.35';
      document.getElementById('opVal').innerText = '0px (chế độ giải thích)';
      document.body.style.cursor = 'auto';
    } else {
      offset = 320;
      frame.style.opacity = '0';
      document.getElementById('opVal').innerText = '320px (tấn công thật)';
      document.body.style.cursor = 'none';
    }
  }

</script>
<style>
  @media (max-width:760px) {
    .reader { width:calc(100% - 32px); padding:22px 20px 30px; }
    .panel { height:min(353px, 52vh); }
    .reader h1 { font-size:20px; }
  }
</style>
</body>
</html>
