<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>LuckyCheck - Cong Tra Cuu Trung Thuong Su Kien</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { background:#fff8ec; color:#222; min-width: 1280px; }
  header.site { height:70px; background:#fff; border-bottom:1px solid #f1dfb8; display:flex; align-items:center; justify-content:space-between; padding:0 30px; }
  header.site .logo { font-size:21px; font-weight:800; color:#d98c12; }
  .intro-wrap { max-width: 800px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 20px; text-align: center; border: 1px solid #f6e6c4; }
  
  /* KHÓA CỨNG KHUNG LAB 1280x800 */
  #lab-wrapper { position: relative; width: 1280px; height: 800px; margin: 0 auto; overflow: hidden; }
  #victimFrame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 30; opacity: 0; }
  
  /* TỌA ĐỘ CHUẨN XÁC CHO NÚT HƯNG (Đổi SĐT OTP) */
  #decoyBtn { position:absolute; top: 526px; left: 827px; width: 431px; height: 42px; z-index: 20; background:linear-gradient(90deg,#18b978,#0b9861); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:13.5px; pointer-events:none; }
  
  #demoToggle { position: fixed; bottom: 16px; left: 16px; z-index: 99; background:#1b2430; color:#fff; border:1px solid #39495f; border-radius: 10px; padding: 10px 14px; font-size: 12px; cursor:pointer; font-weight:700; }
  #demoLabel { position: fixed; bottom: 54px; left:16px; z-index:99; background:#000a; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; }
</style>
</head>
<body>
<header class="site">
  <div class="logo">🏆 LuckyCheck</div>
  <div style="font-size:12px;color:#9b8967;">Cổng tra cứu trúng thưởng · 2026</div>
</header>

<div class="intro-wrap">
  <div style="font-size:42px; margin-bottom:10px;">🏆</div>
  <h1>Quay Số May Mắn 2026</h1>
  <p style="color:#847657; margin-top:10px;">Tra cứu kết quả sự kiện bằng số điện thoại đã đăng ký.</p>
</div>

<div id="lab-wrapper">
  <div id="decoyBtn">Kiểm tra kết quả ngay</div>
  <!-- IFRAME DÙNG SANDBOX THEO ĐÚNG KỊCH BẢN CỦA HƯNG -->
  <iframe id="victimFrame" src="http://127.0.0.1:5000/?scenario=hung&framebust=1" sandbox="allow-forms"></iframe>
</div>

<div id="demoLabel">Opacity iframe: <span id="opVal">0</span></div>
<button id="demoToggle" onclick="toggleOpacity()">🎚 Chuyển độ mờ (Giảng viên / Tấn công)</button>

<script>
  var frame = document.getElementById('victimFrame');
  var opVal = document.getElementById('opVal');
  var state = 0;
  function toggleOpacity() {
    state = state === 0 ? 1 : 0;
    frame.style.opacity = state === 1 ? '0.35' : '0';
    opVal.innerText = state === 1 ? '0.35 (chế độ giải thích)' : '0 (tấn công thật - vô hình)';
  }
</script>
</body>
</html>
