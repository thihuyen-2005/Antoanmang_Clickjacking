<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lab Clickjacking - Mo phong cap quyen hai buoc</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { background:#f2f5fa; color:#1e293b; min-width: 1280px; }
  header.site { height:66px; background:#fff; border-bottom:1px solid #e3e8f0; display:flex; align-items:center; justify-content:space-between; padding:0 28px; }
  header.site .logo { font-size:17px; font-weight:800; color:#273b61; }
  .intro-wrap { max-width: 900px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
  .intro-wrap h1 { margin-bottom: 15px; color: #1b2b47; }
  .intro-wrap p { color: #65728a; line-height: 1.6; margin-bottom: 20px; }
  #startDemoBtn { padding: 12px 24px; border:none; border-radius:10px; background:#315fae; color:#fff; font-weight:bold; cursor:pointer; font-size: 16px; }

  /* KHÓA CỨNG KHUNG LAB 1280x800 */
  #lab-wrapper { position: relative; width: 1280px; height: 800px; margin: 0 auto; overflow: hidden; }
  #victimFrame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 30; opacity: 0; }
  
  /* TỌA ĐỘ CHUẨN XÁC CHO NÚT HẰNG (Bước 1 & Bước 2) */
  .decoy-step { position:absolute; z-index: 20; border:none; border-radius:10px; background:linear-gradient(90deg,#4f8cff,#2a5bd7); color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; display:none; pointer-events:none; }
  
  /* Bước 1: Liên kết Google */
  #decoyStep1 { top: 346px; left: 827px; width: 431px; height: 42px; }
  /* Bước 2: Xác nhận (Khớp với HANG_STEP2 trong app.py: top 449, left 830) */
  #decoyStep2 { top: 449px; left: 830px; width: 260px; height: 42px; }

  #demoToggle { position: fixed; bottom: 16px; left: 16px; z-index: 100; padding:10px 14px; border:1px solid #dce3ed; border-radius:10px; background:#1e2b42; color:#fff; font-size:12px; font-weight:700; cursor:pointer; }
  #demoLabel { position: fixed; bottom: 58px; left:16px; z-index:100; background:#1e2b42; color:#fff; padding:6px 10px; border-radius:7px; font-size:10px; }
  body.explain-mode header.site, body.explain-mode .intro-wrap, body.explain-mode #decoyStep1, body.explain-mode #decoyStep2 { display: none !important; }
  body.explain-mode #victimFrame { opacity: .35 !important; }
</style>
</head>
<body>
<header class="site">
  <div class="logo">Lab Clickjacking</div>
  <div style="color:#71809a; font-size:12px; font-weight:700;">KỊCH BẢN HẰNG · MÔ PHỎNG HAI BƯỚC</div>
</header>

<div class="intro-wrap">
  <h1>Liên kết tài khoản Google</h1>
  <p>Quy trình liên kết gồm hai thao tác: tiếp tục với Google, sau đó xác nhận.</p>
  <button id="startDemoBtn" onclick="startDemo()">Bắt đầu mô phỏng 2 bước</button>
</div>

<div id="lab-wrapper">
  <button id="decoyStep1" class="decoy-step">Tiếp tục với Google</button>
  <button id="decoyStep2" class="decoy-step">Xác nhận liên kết</button>
  <iframe id="victimFrame" src="http://127.0.0.1:5000/?scenario=hang"></iframe>
</div>

<div id="demoLabel">Đang ở trang mô phỏng · iframe đang ẩn</div>
<button id="demoToggle" onclick="toggleOpacity()">Xem giao diện ShopMart</button>

<script>
  var frame = document.getElementById('victimFrame');
  function startDemo() {
    document.getElementById('decoyStep1').style.display = 'block';
    document.getElementById('startDemoBtn').innerText = 'Đang chờ click...';
    document.getElementById('startDemoBtn').disabled = true;
  }

  // Lắng nghe sự kiện từ iframe để bật nút Bước 2
  window.addEventListener('message', function(event) {
    if (event.origin !== 'http://127.0.0.1:5000' || event.source !== frame.contentWindow) return;
    if (event.data && event.data.type === 'shopmart-hang-step1') {
      document.getElementById('decoyStep2').style.display = 'block';
    }
  });

  function toggleOpacity() {
    var explanationMode = !document.body.classList.contains('explain-mode');
    document.body.classList.toggle('explain-mode', explanationMode);
    frame.style.opacity = explanationMode ? '0.35' : '0';
    document.getElementById('demoLabel').innerText = explanationMode ? 'Đang xem giao diện ShopMart' : 'Đang ở trang mô phỏng · iframe đang ẩn';
  }
</script>
</body>
</html>
